name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release tag (e.g. v1.0.1)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Tag is on my-main
        run: |
          git fetch origin my-main
          # Check if the commit pointed to by the tag is an ancestor of origin/my-main
          if ! git merge-base --is-ancestor HEAD origin/my-main; then
            echo "::error::Tag ${{ github.ref_name }} is NOT on the 'my-main' branch. Aborting pipeline."
            exit 1
          fi
          echo "Confirmed: Tag ${{ github.ref_name }} belongs to the 'my-main' branch."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract Tag and Update app/build.gradle
        run: |
          # Determine tag from Git push or workflow_dispatch input
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_TAG="${{ github.event.inputs.version_tag }}"
          else
            RAW_TAG="${{ github.ref_name }}"
          fi

          CLEAN_VERSION=$(echo "$RAW_TAG" | sed -e 's/^[vV]//')
          VERSION_CODE="${{ github.run_number }}"

          echo "Applying workspace version: versionName=${CLEAN_VERSION}, versionCode=${VERSION_CODE}"

          # Update app/build.gradle in workspace for this build only (not committed back)
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${CLEAN_VERSION}\"/" app/build.gradle

          echo "VERSION_NAME=${CLEAN_VERSION}" >> $GITHUB_ENV
          echo "RELEASE_TAG=${RAW_TAG}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Jio Landline ${RAW_TAG}" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/jio-landline-${{ env.RELEASE_TAG }}.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jio-landline-apk-${{ env.RELEASE_TAG }}
          path: release-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apk/jio-landline-${{ env.RELEASE_TAG }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
