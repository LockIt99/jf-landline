name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Configure Build Version
        run: |
          BASE_VERSION=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          if [ -z "$MAJOR" ]; then MAJOR="1"; fi
          if [ -z "$MINOR" ]; then MINOR="0"; fi
          VERSION_NAME="${MAJOR}.${MINOR}.${{ github.run_number }}"
          VERSION_CODE="${{ github.run_number }}"

          echo "Configuring build: version ${VERSION_NAME} (versionCode: ${VERSION_CODE})"

          # Update app/build.gradle so the compiled APK embeds the exact build version
          sed -i "s/versionCode [0-9]*/versionCode ${VERSION_CODE}/" app/build.gradle
          sed -i "s/versionName \".*\"/versionName \"${VERSION_NAME}\"/" app/build.gradle

          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${VERSION_NAME}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Jio Landline v${VERSION_NAME} (Build #${{ github.run_number }})" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/jio-landline-v${{ env.VERSION_NAME }}.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jio-landline-apk-v${{ env.VERSION_NAME }}
          path: release-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-apk/jio-landline-v${{ env.VERSION_NAME }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
