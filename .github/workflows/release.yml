name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Extract Version Info
        run: |
          VERSION_NAME=$(grep "versionName" app/build.gradle | head -n 1 | awk -F '"' '{print $2}')
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="1.0.0"
          fi
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "RELEASE_TAG=v${VERSION_NAME}-build.${{ github.run_number }}" >> $GITHUB_ENV
          echo "RELEASE_TITLE=Jio Landline v${VERSION_NAME} (Build #${{ github.run_number }})" >> $GITHUB_ENV

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Prepare APK Files
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/jio-landline-v${{ env.VERSION_NAME }}.apk
          cp app/build/outputs/apk/release/app-release.apk release-apk/jio-landline-release.apk

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jio-landline-apk-build-${{ github.run_number }}
          path: release-apk/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-apk/jio-landline-v${{ env.VERSION_NAME }}.apk
            release-apk/jio-landline-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
